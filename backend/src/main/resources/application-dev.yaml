spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true

app:
  oauth2:
    authorization-request-cookie:
      secure: false

    flow:
      login-success-redirect-uri: http://localhost:5173/oauth/callback
      signup-redirect-uri: http://localhost:5173/oauth/sign-up
      failure-redirect-uri: http://localhost:5173/login

logging:
  file:
    name: ../logs/concert-backend.log

  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 14
      total-size-cap: 2GB