<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Concert 이메일 인증</title>
  <style>
    /* Google Fonts & Web Fonts Import */
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap');

    body {
      margin: 0;
      padding: 0;
      background-color: #f4f3f8;
      font-family: 'Outfit', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #120f26;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }

    table {
      border-collapse: collapse;
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }

    td {
      padding: 0;
    }
  </style>
</head>

<body style="margin: 0; padding: 0; background-color: #f4f3f8; font-family: 'Outfit', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #120f26;">

<!-- Outer Background Table -->
<table role="presentation" style="width: 100%; border-collapse: collapse; background-color: #f4f3f8;">
  <tr>
    <td style="padding: 40px 16px; text-align: center;">

      <!-- Main Card Container -->
      <table role="presentation" style="width: 100%; max-width: 540px; margin: 0 auto; border-collapse: separate; background-color: #ffffff; border-radius: 20px; border: 1px solid #e7e3f5; box-shadow: 0 16px 40px rgba(67, 36, 212, 0.08); overflow: hidden; text-align: left;">

        <!-- Header Section -->
        <tr>
          <td style="padding: 40px 40px 36px; background: #4f26ed; background: linear-gradient(135deg, #4f26ed 0%, #6d32f6 50%, #8f41f9 100%);">
            <table role="presentation" style="width: 100%; border-collapse: collapse;">
              <tr>
                <td>
                  <!-- Sub Brand Tag -->
                  <span style="display: inline-block; padding: 4px 12px; background-color: rgba(255, 255, 255, 0.15); border-radius: 20px; color: #e3d9ff; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;">
                      limdaeil personal project
                    </span>
                </td>
              </tr>
              <tr>
                <td style="padding-top: 14px; color: #ffffff; font-size: 38px; line-height: 1; font-weight: 800; letter-spacing: -1.2px;">
                  CONCERT
                </td>
              </tr>
              <tr>
                <td style="padding-top: 22px; color: #ffffff; font-size: 22px; line-height: 1.35; font-weight: 700;">
                  이메일 주소 인증
                </td>
              </tr>
              <tr>
                <td style="padding-top: 8px; color: #e2d9ff; font-size: 14px; line-height: 1.6; font-weight: 400;">
                  회원가입 절차를 계속 진행하려면<br>
                  아래의 6자리 인증번호를 입력해 주세요.
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Body Content Section -->
        <tr>
          <td style="padding: 36px 40px 20px;">

            <!-- Code Box Label -->
            <div style="color: #8c85a8; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;">
              Verification Code
            </div>

            <!-- Code Display Box -->
            <div style="margin-top: 10px; padding: 22px 16px; background-color: #f7f5ff; border: 2px dashed #7a46f6; border-radius: 12px; color: #4f26ed; font-family: 'Outfit', sans-serif; font-size: 42px; line-height: 1; font-weight: 800; letter-spacing: 12px; text-align: center;"
                 th:text="${verificationCode}">
              123456
            </div>

          </td>
        </tr>

        <!-- Expiration Notice Section -->
        <tr>
          <td style="padding: 0 40px 36px;">
            <table role="presentation" style="width: 100%; border-collapse: collapse; background-color: #fcfbfe; border: 1px solid #eeeaf8; border-radius: 10px;">
              <tr>
                <td style="width: 36px; padding: 14px 0 14px 16px; vertical-align: middle;">
                  <div style="width: 22px; height: 22px; line-height: 22px; background-color: #eee9ff; color: #6d32f6; font-size: 12px; font-weight: 800; text-align: center; border-radius: 50%;">
                    !
                  </div>
                </td>
                <td style="padding: 14px 16px 14px 10px; color: #665f82; font-size: 13px; line-height: 1.5; vertical-align: middle;">
                  인증번호는 <strong style="color: #4f26ed; font-weight: 700;" th:text="${expireMinutes}">5</strong>분 동안만 유효합니다.
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Card Footer -->
        <tr>
          <td style="padding: 20px 40px; background-color: #141026;">
            <table role="presentation" style="width: 100%; border-collapse: collapse;">
              <tr>
                <td style="color: #ffffff; font-size: 14px; font-weight: 800; letter-spacing: 0.05em; vertical-align: middle;">
                  CONCERT
                </td>
                <td style="color: #8c85a8; font-size: 11px; text-align: right; vertical-align: middle;">
                  Designed &amp; Developed by limdaeil
                </td>
              </tr>
            </table>
          </td>
        </tr>

      </table>

      <!-- Outer Sub Notice -->
      <table role="presentation" style="width: 100%; max-width: 540px; margin: 0 auto; border-collapse: collapse;">
        <tr>
          <td style="padding-top: 18px; color: #9c95ba; font-size: 11px; line-height: 1.6; text-align: center;">
            본인이 요청하지 않은 경우 이 메일을 안전하게 무시하셔도 됩니다.<br>
            © 2026 limdaeil. All rights reserved.
          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>

</body>
</html>
