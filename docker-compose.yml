services:
  mysql:
    image: mysql:8.0
    container_name: concert-mysql
    restart: unless-stopped

    ports:
      - "${MYSQL_PORT:-3306}:3306"

    environment:
      TZ: "${TZ:-Asia/Seoul}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-concert}"
      MYSQL_USER: "${MYSQL_USER:?MYSQL_USER is required}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4
    container_name: concert-redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT:-6379}:${REDIS_CONTAINER_PORT:-6379}"

    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--user", "${REDIS_USERNAME:?REDIS_USERNAME is required}",
        "on",
        ">${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
        "~*",
        "+@all",
        "--user", "default", "off"
      ]

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--user", "${REDIS_USERNAME}",
          "--pass", "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
  redis_data:
