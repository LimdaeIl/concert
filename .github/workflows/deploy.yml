name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "monitoring/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        shell: bash
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          : "${EC2_SSH_KEY:?EC2_SSH_KEY secret is required}"
          : "${EC2_HOST:?EC2_HOST secret is required}"
          : "${EC2_USER:?EC2_USER secret is required}"

          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts


      - name: Validate deployment secrets
        shell: bash
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
          PROD_COMPOSE_ENV: ${{ secrets.PROD_COMPOSE_ENV }}
        run: |
          set -euo pipefail

          : "${PROD_ENV:?PROD_ENV secret is required}"
          : "${PROD_COMPOSE_ENV:?PROD_COMPOSE_ENV secret is required}"


      - name: Update source on EC2
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          cd /home/ubuntu/app/concert

          git fetch origin
          git reset --hard origin/main

          git log -1 --oneline

          EOF


      - name: Create production env files
        shell: bash
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
          PROD_COMPOSE_ENV: ${{ secrets.PROD_COMPOSE_ENV }}
        run: |
          set -euo pipefail

          printf '%s' "$PROD_ENV" > backend.env
          printf '%s' "$PROD_COMPOSE_ENV" > compose.env

          chmod 600 backend.env compose.env

          test -s backend.env
          test -s compose.env


      - name: Upload production env files
        shell: bash
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/ec2_key \
            backend.env \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/concert/backend/.env"

          scp \
            -i ~/.ssh/ec2_key \
            compose.env \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/concert/.env.prod.compose"

          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          chmod 600 /home/ubuntu/app/concert/backend/.env
          chmod 600 /home/ubuntu/app/concert/.env.prod.compose

          test -s /home/ubuntu/app/concert/backend/.env
          test -s /home/ubuntu/app/concert/.env.prod.compose

          EOF


      - name: Deploy Docker infrastructure
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          cd /home/ubuntu/app/concert

          mkdir -p logs
          chmod 755 logs

          docker compose \
            --env-file .env.prod.compose \
            -f docker-compose.prod.yml \
            config --quiet

          docker compose \
            --env-file .env.prod.compose \
            -f docker-compose.prod.yml \
            pull

          docker compose \
            --env-file .env.prod.compose \
            -f docker-compose.prod.yml \
            up -d

          docker compose \
            --env-file .env.prod.compose \
            -f docker-compose.prod.yml \
            ps

          EOF


      - name: Build backend
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          cd /home/ubuntu/app/concert/backend

          test -s .env

          chmod +x gradlew

          ./gradlew clean bootJar -x test

          JAR_FILE=$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-plain.jar' \
            ! -name 'backend.jar' \
            | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "Boot jar not found"
            exit 1
          fi

          cp "$JAR_FILE" build/libs/backend.jar

          ls -lh build/libs/backend.jar

          EOF


      - name: Restart backend
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          sudo systemctl restart concert-backend

          EOF


      - name: Check backend readiness
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          echo "===== Backend Readiness Check ====="

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 20 \
            --retry-delay 3 \
            --retry-connrefused \
            http://127.0.0.1:8080/actuator/health \
            > /dev/null

          echo "Backend is healthy"

          EOF


      - name: Cleanup temporary files
        if: always()
        shell: bash
        run: |
          rm -f backend.env
          rm -f compose.env
          rm -f ~/.ssh/ec2_key