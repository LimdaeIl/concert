name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "monitoring/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ============================================================
      # SSH
      # ============================================================

      - name: Configure SSH
        shell: bash
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          : "${EC2_SSH_KEY:?EC2_SSH_KEY secret is required}"
          : "${EC2_HOST:?EC2_HOST secret is required}"
          : "${EC2_USER:?EC2_USER secret is required}"

          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts


      # ============================================================
      # Validate deployment secrets
      # ============================================================

      - name: Validate deployment secrets
        shell: bash
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
          PROD_COMPOSE_ENV: ${{ secrets.PROD_COMPOSE_ENV }}
        run: |
          set -euo pipefail

          : "${PROD_ENV:?PROD_ENV secret is required}"
          : "${PROD_COMPOSE_ENV:?PROD_COMPOSE_ENV secret is required}"

          echo "Deployment secrets validated"


      # ============================================================
      # Update source
      # ============================================================

      - name: Update source on EC2
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          cd /home/ubuntu/app/concert

          echo "===== Update Source ====="

          git fetch origin
          git reset --hard origin/main

          echo "===== Current Commit ====="
          git log -1 --oneline

          EOF


      # ============================================================
      # Create local temporary env files
      # ============================================================

      - name: Create production env files
        shell: bash
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
          PROD_COMPOSE_ENV: ${{ secrets.PROD_COMPOSE_ENV }}
        run: |
          set -euo pipefail

          printf '%s' "$PROD_ENV" > backend.env
          printf '%s' "$PROD_COMPOSE_ENV" > compose.env

          chmod 600 backend.env compose.env

          test -s backend.env
          test -s compose.env

          echo "Production env files created"


      # ============================================================
      # Upload env files
      # ============================================================

      - name: Upload production env files
        shell: bash
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/ec2_key \
            backend.env \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/concert/backend/.env"

          scp \
            -i ~/.ssh/ec2_key \
            compose.env \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/concert/.env.prod.compose"

          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          chmod 600 /home/ubuntu/app/concert/backend/.env
          chmod 600 /home/ubuntu/app/concert/.env.prod.compose

          test -s /home/ubuntu/app/concert/backend/.env
          test -s /home/ubuntu/app/concert/.env.prod.compose

          echo "Production env files uploaded"

          EOF


      # ============================================================
      # Prepare directories
      # ============================================================

      - name: Prepare production directories
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          mkdir -p /home/ubuntu/app/concert/logs
          chmod 755 /home/ubuntu/app/concert/logs

          EOF


      # ============================================================
      # Docker infrastructure
      # ============================================================

      - name: Deploy Docker infrastructure
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          cd /home/ubuntu/app/concert

          echo "===== Validate Docker Compose ====="

          docker compose \
            --env-file .env.prod.compose \
            -f docker-compose.prod.yml \
            config --quiet

          echo "===== Pull Docker Images ====="

          docker compose \
            --env-file .env.prod.compose \
            -f docker-compose.prod.yml \
            pull

          echo "===== Start Docker Infrastructure ====="

          docker compose \
            --env-file .env.prod.compose \
            -f docker-compose.prod.yml \
            up -d

          echo "===== Docker Status ====="

          docker compose \
            --env-file .env.prod.compose \
            -f docker-compose.prod.yml \
            ps

          EOF


      # ============================================================
      # Backend build
      # ============================================================

      - name: Build backend
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          cd /home/ubuntu/app/concert/backend

          echo "===== Validate Backend Environment ====="

          test -s .env

          echo "===== Java ====="
          java -version

          echo "===== Gradle Build ====="

          chmod +x gradlew

          ./gradlew clean bootJar -x test

          echo "===== Resolve Boot Jar ====="

          JAR_FILE=$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-plain.jar' \
            ! -name 'backend.jar' \
            | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "Boot jar not found"
            exit 1
          fi

          cp "$JAR_FILE" build/libs/backend.jar

          echo "===== Deployment Jar ====="
          ls -lh build/libs/backend.jar

          EOF


      # ============================================================
      # Restart backend
      # ============================================================

      - name: Restart backend
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          echo "===== Restart Backend ====="

          sudo systemctl restart concert-backend

          echo "Backend restart requested"

          EOF


      # ============================================================
      # Backend readiness check
      # ============================================================

      - name: Check backend readiness
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          echo "===== Backend Readiness Check ====="

          if curl \
            --fail \
            --silent \
            --show-error \
            --retry 20 \
            --retry-delay 3 \
            --retry-connrefused \
            http://127.0.0.1:8080/actuator/health \
            > /dev/null; then

            echo "Backend is healthy"

          else
            echo "Backend readiness check failed"

            echo "===== Backend Service ====="
            sudo systemctl \
              --no-pager \
              --full \
              status concert-backend || true

            echo "===== Recent Backend Logs ====="
            sudo journalctl \
              -u concert-backend \
              -n 200 \
              --no-pager || true

            echo "===== Docker Status ====="
            cd /home/ubuntu/app/concert

            docker compose \
              --env-file .env.prod.compose \
              -f docker-compose.prod.yml \
              ps || true

            exit 1
          fi

          EOF


      # ============================================================
      # Final verification
      # ============================================================

      - name: Verify deployment
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          cd /home/ubuntu/app/concert

          echo "=========================================="
          echo "       Deployment Successful"
          echo "=========================================="

          echo
          echo "===== Backend ====="
          sudo systemctl is-active --quiet concert-backend
          echo "concert-backend: active"

          echo
          echo "===== Health ====="
          curl \
            --fail \
            --silent \
            http://127.0.0.1:8080/actuator/health

          echo
          echo
          echo "===== Docker ====="

          docker compose \
            --env-file .env.prod.compose \
            -f docker-compose.prod.yml \
            ps

          echo
          echo "===== Logs ====="

          ls -lh logs || true

          echo
          echo "===== Commit ====="

          git log -1 --oneline

          EOF


      # ============================================================
      # Cleanup
      # ============================================================

      - name: Cleanup temporary files
        if: always()
        shell: bash
        run: |
          rm -f backend.env
          rm -f compose.env
          rm -f ~/.ssh/ec2_key
          