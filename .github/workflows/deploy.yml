name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "monitoring/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # ---------------------------------------
      # EC2 source update
      # ---------------------------------------

      - name: Update source on EC2
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          cd /home/ubuntu/app/concert

          git fetch origin
          git reset --hard origin/main

          EOF

      # ---------------------------------------
      # Spring production environment
      # ---------------------------------------

      - name: Create backend production env
        shell: bash
        run: |
          printf '%s' "${{ secrets.PROD_ENV }}" > backend.env
          chmod 600 backend.env

      - name: Upload backend production env
        shell: bash
        run: |
          scp \
            -i ~/.ssh/ec2_key \
            backend.env \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/concert/backend/.env"

      # ---------------------------------------
      # Docker production environment
      # ---------------------------------------

      - name: Create Docker production env
        shell: bash
        run: |
          printf '%s' "${{ secrets.PROD_COMPOSE_ENV }}" > compose.env
          chmod 600 compose.env

      - name: Upload Docker production env
        shell: bash
        run: |
          scp \
            -i ~/.ssh/ec2_key \
            compose.env \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/concert/.env.prod.compose"

      # ---------------------------------------
      # Docker infrastructure
      # ---------------------------------------

      - name: Deploy production infrastructure
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          cd /home/ubuntu/app/concert

          chmod 600 .env.prod.compose

          echo "===== Validate Docker Compose ====="
          docker compose \
            --env-file .env.prod.compose \
            -f docker-compose.prod.yml \
            config --quiet

          echo "===== Pull Docker Images ====="
          docker compose \
            --env-file .env.prod.compose \
            -f docker-compose.prod.yml \
            pull

          echo "===== Start Infrastructure ====="
          docker compose \
            --env-file .env.prod.compose \
            -f docker-compose.prod.yml \
            up -d

          echo "===== Docker Status ====="
          docker compose \
            --env-file .env.prod.compose \
            -f docker-compose.prod.yml \
            ps

          EOF

      # ---------------------------------------
      # Backend build
      # ---------------------------------------

      - name: Build backend
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          cd /home/ubuntu/app/concert/backend

          if [ ! -f .env ]; then
            echo ".env file not found"
            exit 1
          fi

          chmod 600 .env

          set -a
          source .env
          set +a

          echo "===== Java ====="
          java -version

          echo "===== Gradle Build ====="

          chmod +x gradlew

          ./gradlew clean bootJar -x test

          JAR_FILE=$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-plain.jar' \
            ! -name 'backend.jar' \
            | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "Jar file not found"
            exit 1
          fi

          cp "$JAR_FILE" build/libs/backend.jar

          echo "Built:"
          ls -lh build/libs/backend.jar

          EOF

      # ---------------------------------------
      # Backend restart
      # ---------------------------------------

      - name: Restart backend
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          echo "===== Restart Backend ====="

          sudo systemctl restart concert-backend

          sleep 5

          sudo systemctl is-active --quiet concert-backend

          echo "===== Backend Status ====="
          sudo systemctl --no-pager --full status concert-backend

          EOF

      # ---------------------------------------
      # Health check
      # ---------------------------------------

      - name: Health check
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          echo "===== Health Check ====="

          for i in {1..30}; do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8080/actuator/health \
              > /dev/null; then

              echo "Backend is healthy"
              exit 0
            fi

            sleep 2
          done

          echo "Backend health check failed"

          sudo journalctl \
            -u concert-backend \
            -n 200 \
            --no-pager

          exit 1

          EOF
