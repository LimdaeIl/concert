services:
  redis:
    image: redis:7.4
    container_name: concert-redis
    restart: unless-stopped

    environment:
      TZ: "${TZ:-Asia/Seoul}"
      REDIS_USERNAME: "${REDIS_USERNAME:?REDIS_USERNAME is required}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"

    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--appendfsync", "everysec",
        "--user", "${REDIS_USERNAME:?REDIS_USERNAME is required}",
        "on",
        ">${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
        "~*",
        "+@all",
        "--user", "default", "off"
      ]

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --user \"$${REDIS_USERNAME}\" --pass \"$${REDIS_PASSWORD}\" ping | grep -q PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: concert-prometheus
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "127.0.0.1:9090:9090"

    networks:
      - concert-network


  loki:
    image: grafana/loki:3.7.0
    container_name: concert-loki
    restart: unless-stopped

    command:
      - -config.file=/etc/loki/local-config.yml

    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki

    ports:
      - "127.0.0.1:3100:3100"

    networks:
      - concert-network


  alloy:
    image: grafana/alloy:v1.18.1
    container_name: concert-alloy
    restart: unless-stopped

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/concert:ro
      - alloy-data:/var/lib/alloy/data

    ports:
      - "127.0.0.1:12345:12345"

    depends_on:
      - loki

    networks:
      - concert-network


  grafana:
    image: grafana/grafana:13.1.3
    container_name: concert-grafana
    restart: unless-stopped

    environment:
      TZ: "${TZ:-Asia/Seoul}"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}"
      GF_USERS_ALLOW_SIGN_UP: "false"

    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus
      - loki

    networks:
      - concert-network


networks:
  concert-network:
    driver: bridge


volumes:
  redis-data:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
